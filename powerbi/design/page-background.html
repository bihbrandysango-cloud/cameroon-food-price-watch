<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page Background</title>
<!-- Renders a Power BI page background (1280x720) in the Green Stalk design.
     Open with ?page=overview (default). Screenshot with headless Chrome; see powerbi/build/render_images.ps1. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  html, body { margin:0; width:1280px; height:720px; overflow:hidden; background:#0C2614; font-family:Outfit, sans-serif; color:#EAF3DF; }
  svg { position:absolute; inset:0; }
</style>
</head>
<body>
<svg id="bg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
const PAGES = {
  // panels: [x, y, w, h, title, subtitle]
  overview: {
    active: 0,
    panels: [
      [34, 124, 300, 250, "This month", ""],
      [34, 388, 300, 306, "Spotlight", "Market furthest from normal"],
      [350, 124, 400, 570, "Market map", ""],
      [766, 124, 480, 570, "Gap from normal, by market", "This month, against the same month in the last five years"],
    ],
    legend: [362, 170],
  },
};
const page = PAGES[new URLSearchParams(location.search).get("page") || "overview"];
const bg = d3.select("#bg");

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function plant(g, x, base, h, o) {
  const r = o.rand, lean = (r() - .5) * h * .08, top = base - h;
  const p = g.append("g").attr("opacity", o.opacity ?? 1);
  p.append("path").attr("d", `M${x},${base} C${x + lean * .3},${base - h * .4} ${x + lean * .8},${base - h * .75} ${x + lean},${top}`)
    .attr("stroke", o.stalk).attr("stroke-width", Math.max(2, h * .028)).attr("fill", "none").attr("stroke-linecap", "round");
  const nLeaves = 5 + Math.floor(r() * 3);
  for (let i = 0; i < nLeaves; i++) {
    const t = .18 + i * (.7 / nLeaves), side = i % 2 ? 1 : -1;
    const sx = x + lean * t, sy = base - h * t, len = h * (.42 - t * .18) * (.85 + r() * .3);
    const ex = sx + side * len, ey = sy + len * (.15 + r() * .25), cx1 = sx + side * len * .45, cy1 = sy - len * .42, wdt = Math.max(3, h * .035);
    p.append("path").attr("d", `M${sx},${sy} Q${cx1},${cy1 - wdt} ${ex},${ey} Q${cx1},${cy1 + wdt} ${sx},${sy + wdt * .6} Z`).attr("fill", i % 3 === 0 ? o.leafLight : o.leaf);
  }
  const tx = x + lean;
  for (let k = -3; k <= 3; k++) p.append("path").attr("d", `M${tx},${top} q${k * h * .018},${-h * .05} ${k * h * .03},${-h * .02}`).attr("stroke", o.tassel).attr("stroke-width", Math.max(1, h * .006)).attr("fill", "none");
  if (o.cob) {
    const ct = .45 + r() * .12, cxp = x + lean * ct, cyp = base - h * ct, side = r() > .5 ? 1 : -1, cl = h * .17;
    const cg = p.append("g").attr("transform", `translate(${cxp + side * h * .03},${cyp}) rotate(${side * 22})`);
    cg.append("ellipse").attr("rx", cl * .23).attr("ry", cl * .5).attr("cy", -cl * .45).attr("fill", o.cobColor);
    for (let rr = 0; rr < 6; rr++) for (let kk = -1; kk <= 1; kk++) cg.append("circle").attr("cx", kk * cl * .1).attr("cy", -cl * .78 + rr * cl * .13).attr("r", cl * .035).attr("fill", "rgba(120,80,0,.25)");
    cg.append("path").attr("d", `M0,0 C${-cl * .4},${-cl * .3} ${-cl * .35},${-cl * .7} ${-cl * .1},${-cl * .95} C${-cl * .2},${-cl * .5} ${-cl * .05},${-cl * .25} 0,0Z`).attr("fill", o.leaf);
    cg.append("path").attr("d", `M0,0 C${cl * .4},${-cl * .3} ${cl * .35},${-cl * .7} ${cl * .1},${-cl * .95} C${cl * .2},${-cl * .5} ${cl * .05},${-cl * .25} 0,0Z`).attr("fill", o.leafLight);
  }
}
function field(rows) {
  rows.forEach(rw => { const g = bg.append("g"), r = rng(rw.seed);
    for (let x = -20; x < 1320; x += rw.gap * (0.8 + r() * .4)) plant(g, x, rw.base + (r() - .5) * 8, rw.h * (0.85 + r() * .3), { ...rw, rand: r, cob: r() < rw.cobRate }); });
}

// Styles: "field" is the full maize field; the others are minimalist versions of the same layout.
//   panel: fill, stroke, corner radius · tabs: "pill" or "underline"
const STYLES = {
  field:  { panel: ["rgba(9,30,15,.74)", "rgba(160,210,110,.22)", 18], tabs: "pill" },
  leaf:   { panel: ["rgba(17,48,28,.86)", "none", 16], tabs: "pill" },
  line:   { panel: ["rgba(255,255,255,.015)", "#2A5236", 10], tabs: "underline" },
  kernel: { panel: ["#12321E", "none", 20], tabs: "pill" },
  glow:   { panel: ["rgba(255,255,255,.035)", "rgba(255,255,255,.09)", 18], tabs: "underline" },
  // light styles: dark text on light panels, easiest to read
  cream:  { panel: ["#FFFFFF", "#F0E2B2", 16], tabs: "pill", light: true,
            th: { title: "#2A3B1C", panelTitle: "#2A3B1C", sub: "#7A7360", tabOn: ["#F2C230", "#2A2410"], tabOff: ["#FFFFFF", "#EAD9A0", "#6B5E3A"] } },
  fresh:  { panel: ["#FFFFFF", "#D6E7CD", 16], tabs: "pill", light: true,
            th: { title: "#FFFFFF", panelTitle: "#1E4A24", sub: "#6A7C62", tabOn: ["#F2C230", "#1B3A1E"], tabOff: ["rgba(255,255,255,.14)", "rgba(255,255,255,.45)", "#EAF6E3"] } },
  white:  { panel: ["#FBFBF7", "#ECEAE0", 14], tabs: "underline", light: true,
            th: { title: "#1F3A22", panelTitle: "#1F3A22", sub: "#77786C", tabOn: ["#2E7D32", "#F2B705"], tabOff: [null, null, "#77786C"] } },
};
const styleName = new URLSearchParams(location.search).get("style") || "field";
const S = STYLES[styleName];
// text and tab colours: dark styles share one set, light styles bring their own
const TH = S.th || { title: "#EAF3DF", panelTitle: "#CFE3BC", sub: "#9FB58F", tabOn: ["#F5C518", "#0C2614"], tabOff: ["rgba(9,30,15,.55)", "rgba(160,210,110,.35)", "#CFE3BC"] };
const defs = bg.append("defs");
function gradient(id, stops, radial, attrs = {}) {
  const g = defs.append(radial ? "radialGradient" : "linearGradient").attr("id", id);
  Object.entries(attrs).forEach(([k, v]) => g.attr(k, v));
  stops.forEach(([o, c, op]) => g.append("stop").attr("offset", o).attr("stop-color", c).attr("stop-opacity", op ?? 1));
}

if (styleName === "leaf") {
  // flat deep green, one long maize leaf sweeping across the page, seen faintly through the panels
  bg.append("rect").attr("width", 1280).attr("height", 720).attr("fill", "#0D2416");
  bg.append("path").attr("d", "M-40,760 C260,600 620,330 1320,60 C700,380 340,640 120,760Z").attr("fill", "#17462A");
  bg.append("path").attr("d", "M-30,755 C280,590 640,330 1310,66").attr("stroke", "#F5C518").attr("stroke-width", 1.4).attr("fill", "none").attr("opacity", .5);
} else if (styleName === "line") {
  // near-black green, gold hairlines only
  bg.append("rect").attr("width", 1280).attr("height", 720).attr("fill", "#0A1C11");
  bg.append("line").attr("x1", 34).attr("x2", 1246).attr("y1", 112).attr("y2", 112).attr("stroke", "#F5C518").attr("stroke-opacity", .35);
  bg.append("line").attr("x1", 34).attr("x2", 1246).attr("y1", 706).attr("y2", 706).attr("stroke", "#2A5236");
} else if (styleName === "kernel") {
  // deep green with a faint band of maize kernels fading out from the top-right corner
  bg.append("rect").attr("width", 1280).attr("height", 720).attr("fill", "#0E2617");
  for (let r = 0; r < 26; r++) for (let c = 0; c < 46; c++) {
    const x = 1280 - c * 15 - (r % 2) * 7.5, y = r * 13, d = Math.hypot(1280 - x, y) / 520;
    if (d < 1) bg.append("ellipse").attr("cx", x).attr("cy", y).attr("rx", 4.2).attr("ry", 5.2).attr("fill", "#F5C518").attr("opacity", .13 * (1 - d) ** 1.6);
  }
} else if (styleName === "glow") {
  // soft vertical gradient and one warm glow, like late sun on a field
  gradient("v", [["0%", "#123520"], ["100%", "#081810"]], false, { x1: 0, x2: 0, y1: 0, y2: 1 });
  gradient("sun", [["0%", "#FFD54A", .16], ["60%", "#F5C518", .05], ["100%", "#F5C518", 0]], true, { cx: "50%", cy: "50%", r: "50%" });
  bg.append("rect").attr("width", 1280).attr("height", 720).attr("fill", "url(#v)");
  bg.append("circle").attr("cx", 1180).attr("cy", 40).attr("r", 420).attr("fill", "url(#sun)");
}

// soft shadow for light panels
const shadow = defs.append("filter").attr("id", "shadow").attr("x", "-5%").attr("y", "-5%").attr("width", "110%").attr("height", "112%");
shadow.append("feDropShadow").attr("dx", 0).attr("dy", 4).attr("stdDeviation", 8).attr("flood-color", "#5A4A10").attr("flood-opacity", .08);

// a simple maize cob with two leaves, used as decoration on the light styles
function cobArt(x, y, s, o = {}) {
  const g = bg.append("g").attr("transform", `translate(${x},${y}) scale(${s}) rotate(${o.rotate || 0})`).attr("opacity", o.opacity ?? 1);
  g.append("path").attr("d", "M0,0 C-30,-40 -34,-110 -8,-170 C-14,-110 -6,-50 0,0Z").attr("fill", o.leaf || "#6DAA45");
  g.append("path").attr("d", "M0,0 C30,-40 34,-110 8,-170 C14,-110 6,-50 0,0Z").attr("fill", o.leaf2 || "#4E8F35");
  g.append("ellipse").attr("cx", 0).attr("cy", -92).attr("rx", 20).attr("ry", 62).attr("fill", o.cob || "#F2C230");
  for (let r = 0; r < 12; r++) for (let k = -2; k <= 2; k++) {
    const yy = -146 + r * 9.6, half = 20 * Math.sqrt(Math.max(0, 1 - ((yy + 92) / 62) ** 2));
    if (Math.abs(k * 7) < half - 3) g.append("ellipse").attr("cx", k * 7 + (r % 2) * 1.5).attr("cy", yy).attr("rx", 3.1).attr("ry", 3.8).attr("fill", o.kernel || "#F8D65A").attr("stroke", "rgba(170,120,0,.25)").attr("stroke-width", .6);
  }
  g.append("path").attr("d", "M0,0 C-24,-30 -26,-70 -14,-104 C-12,-70 -6,-36 0,0Z").attr("fill", o.leaf || "#6DAA45").attr("opacity", .95);
  g.append("path").attr("d", "M0,-154 q6,-14 16,-18 M0,-154 q-4,-15 -12,-20").attr("stroke", "#C98A3A").attr("stroke-width", 1.6).attr("fill", "none");
}

if (styleName === "cream") {
  // warm maize cream, a gold band at the top, a cob resting in the bottom-right corner
  gradient("cr", [["0%", "#FFF3CC"], ["45%", "#FFF9E6"], ["100%", "#FFFDF6"]], false, { x1: 0, x2: 0, y1: 0, y2: 1 });
  bg.append("rect").attr("width", 1280).attr("height", 720).attr("fill", "url(#cr)");
  bg.append("rect").attr("width", 1280).attr("height", 6).attr("fill", "#F2C230");
  // a cob lying in the open space of the header, between the title and the slicers
  cobArt(560, 84, .42, { rotate: 72, opacity: .95 });
  cobArt(640, 98, .34, { rotate: 100, opacity: .8 });
} else if (styleName === "fresh") {
  // pale green page with a deep green header band and a light leaf sweeping through it
  bg.append("rect").attr("width", 1280).attr("height", 720).attr("fill", "#EEF6EA");
  bg.append("rect").attr("width", 1280).attr("height", 116).attr("fill", "#2E7D32");
  bg.append("path").attr("d", "M520,116 C700,40 920,10 1300,-10 L1300,116Z").attr("fill", "#388E3C");
  bg.append("path").attr("d", "M760,116 C900,70 1080,46 1300,40 L1300,116Z").attr("fill", "#43A047").attr("opacity", .6);
  bg.append("rect").attr("y", 116).attr("width", 1280).attr("height", 4).attr("fill", "#F2C230");
} else if (styleName === "white") {
  // clean white page; maize and a touch of green only at the edges
  bg.append("rect").attr("width", 1280).attr("height", 720).attr("fill", "#FFFFFF");
  bg.append("path").attr("d", "M0,708 C300,696 520,716 820,702 C1020,694 1160,706 1280,700 L1280,720 L0,720Z").attr("fill", "#8BC34A");
  bg.append("path").attr("d", "M0,714 C260,706 560,722 900,710 C1080,704 1200,712 1280,708 L1280,720 L0,720Z").attr("fill", "#2E7D32");
  bg.append("line").attr("x1", 34).attr("x2", 1246).attr("y1", 113).attr("y2", 113).attr("stroke", "#F2B705").attr("stroke-width", 2);
}

if (styleName === "field") {
// sky glow and sweeping leaves
const gr = bg.append("defs").append("radialGradient").attr("id", "glow").attr("cx", "70%").attr("cy", "0%").attr("r", "80%");
[["0%", "#1F4F25"], ["100%", "#0A2011"]].forEach(([o, c]) => gr.append("stop").attr("offset", o).attr("stop-color", c));
bg.append("rect").attr("width", 1280).attr("height", 720).attr("fill", "url(#glow)");
const leaf = (d, c, op) => bg.append("path").attr("d", d).attr("fill", c).attr("opacity", op);
leaf("M-60,760 C200,520 420,360 760,330 C520,420 300,560 120,760Z", "#174A26", .9);
leaf("M1340,760 C1100,560 980,380 640,250 C900,420 1060,560 1180,760Z", "#1A5A2C", .8);
leaf("M300,760 C380,560 560,420 900,470 C640,500 480,600 420,760Z", "#123D20", .9);
leaf("M-40,200 C180,160 360,60 560,-20 C400,120 220,230 -40,290Z", "#143F22", .8);
leaf("M1320,120 C1120,170 940,120 820,-30 C980,60 1120,90 1320,40Z", "#174A26", .7);
field([
  { seed: 5, base: 740, h: 480, gap: 64, stalk: "#1A4A26", leaf: "#1C5029", leafLight: "#22592E", tassel: "#C9A22A", cobColor: "#D9AE1C", cobRate: .4, opacity: .75 },
  { seed: 19, base: 770, h: 330, gap: 52, stalk: "#225C2F", leaf: "#26652F", leafLight: "#2F7838", tassel: "#E8B92C", cobColor: "#F5C518", cobRate: .55, opacity: .9 },
]);
const edge = rng(41);
[[8, 760, 600], [1268, 760, 600], [20, 790, 420], [1250, 790, 440]].forEach(([x, b, h]) =>
  plant(bg.append("g"), x, b, h, { rand: edge, stalk: "#2A6B37", leaf: "#2F7A3B", leafLight: "#3B8C45", tassel: "#F5C518", cobColor: "#F5C518", cob: true }));
const t = rng(7);
for (let i = 0; i < 26; i++) { const x = 30 + i * 49 + t() * 20, len = 30 + t() * 40;
  for (let k = -3; k <= 3; k++) bg.append("path").attr("d", `M${x},-4 q${k * 4},${len * .6} ${k * 9},${len}`).attr("stroke", "#F5C518").attr("stroke-width", 1.3).attr("fill", "none").attr("opacity", .35 + t() * .4); }
}

// header: cob logo, title, page tabs (Power BI buttons sit on top of the tabs later)
const logo = bg.append("g").attr("transform", "translate(34,62) scale(1.2)");
logo.append("path").attr("d", "M9 30c-2-6 0-12 4-15M23 30c2-6 0-12-4-15").attr("stroke", "#7DBB4A").attr("stroke-width", 2.2).attr("fill", "none").attr("stroke-linecap", "round");
logo.append("ellipse").attr("cx", 16).attr("cy", 13).attr("rx", 6.5).attr("ry", 11).attr("fill", "#F5C518");
for (let r = 0; r < 5; r++) for (let k = 0; k < 3; k++) logo.append("circle").attr("cx", 12.2 + k * 3.8).attr("cy", 5 + r * 3.9).attr("r", 1.3).attr("fill", "rgba(0,0,0,.18)");
bg.append("text").attr("x", 82).attr("y", 90).attr("font-size", 24).attr("font-weight", 700).attr("fill", TH.title).text("Cameroon Food Price Watch");
// page tabs: a slim row across the top, right-aligned; the title row below holds the slicers
const tabs = ["This month", "Markets", "Foods", "Regions", "Next month", "Data quality", "Method"];
let tx = 1246;
tabs.slice().reverse().forEach((label, ri) => {
  const i = tabs.length - 1 - ri, w = label.length * 6.4 + 22; tx -= w;
  const on = i === page.active;
  if (S.tabs === "pill") {
    bg.append("rect").attr("x", tx).attr("y", 16).attr("width", w).attr("height", 24).attr("rx", 12)
      .attr("fill", on ? TH.tabOn[0] : TH.tabOff[0]).attr("stroke", on ? "none" : TH.tabOff[1]);
    bg.append("text").attr("x", tx + w / 2).attr("y", 32).attr("text-anchor", "middle").attr("font-size", 11.5).attr("font-weight", on ? 700 : 500).attr("fill", on ? TH.tabOn[1] : TH.tabOff[2]).text(label);
  } else {
    // underline tabs: tabOn = [text colour, underline colour]
    const onText = S.th ? TH.tabOn[0] : "#F5C518", line = S.th ? TH.tabOn[1] : "#F5C518";
    bg.append("text").attr("x", tx + w / 2).attr("y", 32).attr("text-anchor", "middle").attr("font-size", 12).attr("font-weight", on ? 700 : 400).attr("fill", on ? onText : (S.th ? TH.tabOff[2] : "#9FB58F")).text(label);
    if (on) bg.append("rect").attr("x", tx + 10).attr("y", 39).attr("width", w - 20).attr("height", 2.5).attr("rx", 1).attr("fill", line);
  }
  tx -= 4;
});

// glass panels with their titles
page.panels.forEach(([x, y, w, h, title, sub]) => {
  bg.append("rect").attr("x", x).attr("y", y).attr("width", w).attr("height", h).attr("rx", S.panel[2]).attr("fill", S.panel[0]).attr("stroke", S.panel[1])
    .attr("filter", S.light ? "url(#shadow)" : null);
  if (S.light) bg.append("rect").attr("x", x + 18).attr("y", y + 15).attr("width", 4).attr("height", 18).attr("rx", 2).attr("fill", "#F2B705");
  const tx0 = x + (S.light ? 30 : 18);
  bg.append("text").attr("x", tx0).attr("y", y + 29).attr("font-size", S.light ? 16 : 15).attr("font-weight", S.light ? 700 : 500).attr("fill", TH.panelTitle).text(title);
  if (sub) bg.append("text").attr("x", tx0).attr("y", y + 47).attr("font-size", 12).attr("fill", TH.sub).text(sub);
});

// map legend: colour = direction, size = how big the change is
if (page.legend) {
  const items = S.light
    ? [["#C8372D", "Too expensive", 6], ["#8F8A7E", "Normal", 4.5], ["#2864A8", "Too cheap", 6]]
    : [["#E5573E", "Too expensive", 6], ["#F4A462", "Rising", 4.5], ["#7F8A82", "Normal", 4.5], ["#93C6F2", "Falling", 4.5], ["#2F84D8", "Too cheap", 6]];
  let lx = page.legend[0];
  items.forEach(([c, l, r]) => { bg.append("circle").attr("cx", lx + 6).attr("cy", page.legend[1]).attr("r", r).attr("fill", c);
    bg.append("text").attr("x", lx + 15).attr("y", page.legend[1] + 4).attr("font-size", S.light ? 12 : 11).attr("fill", TH.panelTitle).text(l); lx += l.length * 6.6 + 32; });
  bg.append("text").attr("x", page.legend[0]).attr("y", page.legend[1] + 20).attr("font-size", S.light ? 11.5 : 10.5).attr("fill", TH.sub)
    .text(S.light ? "Bigger dot = bigger change from a normal month" : "Big dot = alert (40%+ from normal) · small dot = watch (20–40%)");
}
document.body.setAttribute("data-ready", "1");
</script>
</body>
</html>
