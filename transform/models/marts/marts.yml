version: 2

models:
  - name: fct_monthly_prices
    description: One price per market, food, price type and month in a standard unit, with prices far from the national median flagged as suspect (kept, not deleted).
    columns:
      - name: market_code
        description: Every price belongs to a known market.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_markets')
                field: market_code
      - name: price_type
        tests:
          - accepted_values:
              arguments:
                values: ["retail", "wholesale"]
      - name: price_per_unit
        tests: [not_null]
      - name: is_suspect_price
        tests: [not_null]

  - name: dim_markets
    description: One row per market with location and how complete its price history is.
    columns:
      - name: market_code
        tests: [unique, not_null]
      - name: coverage
        description: Share of months between first and last report that have a price.

  - name: fct_price_alerts
    description: Every price (suspect ones left out) compared with the median for the same market, food, price type and calendar month in earlier years, and given an alert level in both directions.
    columns:
      - name: alert_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["normal", "watch high", "watch low", "alert high", "alert low", "not enough history"]
      - name: years_of_history
        tests: [not_null]

  - name: fct_alert_types
    description: Every judged price with a reason it is off normal (general price shift, market-wide shift, local lasting, local new), using only what was known that month. next_month is for checking the labels afterwards.
    columns:
      - name: alert_type
        description: Empty for prices within the normal range.
        tests:
          - accepted_values:
              arguments:
                values: ["general price shift", "market-wide shift", "local, lasting", "local, new"]
      - name: months_running
        tests: [not_null]

  - name: rpt_current_alerts
    description: The latest month's prices outside the normal range, furthest from normal first.
    columns:
      - name: alert_level
        description: Only prices outside the normal range belong here.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["watch high", "watch low", "alert high", "alert low"]
